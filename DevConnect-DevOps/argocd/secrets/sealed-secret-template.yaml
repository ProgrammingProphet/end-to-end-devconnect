apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mongodb-secret
  namespace: devconnect
spec:
  # The encrypted data section (obtained after running: kubeseal < secrets.yaml > sealed-secrets.yaml)
  encryptedData:
    MONGODB_URI: AgA1B3c4D5e... # Replace with output from: echo -n "mongodb://..." | kubeseal --controller-name=sealed-secrets-controller
    JWT_SECRET: AgA1B3c4D5e...  # Replace with output from: echo -n "myjwtsecret..." | kubeseal --controller-name=sealed-secrets-controller
    MONGO_INITDB_ROOT_USERNAME: AgA1B3c4D5e...
    MONGO_INITDB_ROOT_PASSWORD: AgA1B3c4D5e...
    MONGO_INITDB_DATABASE: AgA1B3c4D5e...
  template:
    metadata:
      name: mongodb-secret
      namespace: devconnect
    type: Opaque
