apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devconnect-dev

resources:
  - ../../base

secretGenerator:
  - name: mongodb-secret
    envs:
      - secrets.env

images:
  - name: programmingprobhet/devconnect-backend
    newTag: dev-1.1.1
  - name: programmingprobhet/devconnect-frontend
    newTag: dev-1.1.1

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend-deployment
      spec:
        replicas: 1
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend-deployment
      spec:
        replicas: 1
