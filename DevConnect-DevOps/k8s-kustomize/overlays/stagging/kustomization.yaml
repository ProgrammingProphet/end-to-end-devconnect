apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devconnect-stage

resources:
  - ../../base

secretGenerator:
  - name: mongodb-secret
    envs:
      - secrets.env

images:
  - name: programmingprobhet/devconnect-backend
    newTag: stage-latest
  - name: programmingprobhet/devconnect-frontend
    newTag: stage-latest

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend-deployment
      spec:
        replicas: 2
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend-deployment
      spec:
        replicas: 2
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: ingress-devconnect
      spec:
        rules:
          - host: devconnect-stage.k8s.local
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: frontend-service
                      port:
                        number: 80
                - path: /api
                  pathType: Prefix
                  backend:
                    service:
                      name: backend-service
                      port:
                        number: 5000
