---
# 1. Install prerequisites, Docker/Containerd, and Kubernetes packages on all nodes
- name: Install Prerequisites on all Nodes
  hosts: master, workers
  become: true
  gather_facts: true
  roles:
    - common
    - docker
    - kubeadm

# 2. Initialize Master Node
- name: Initialize Kubernetes Master
  hosts: master
  become: true
  gather_facts: true
  tasks:
    - name: Check if Kubernetes admin.conf exists
      stat:
        path: /etc/kubernetes/admin.conf
      register: kube_admin_conf

    - name: Initialize kubeadm cluster
      command: >
        kubeadm init 
        --pod-network-cidr=10.244.0.0/16 
        --apiserver-advertise-address={{ ansible_default_ipv4.address }}
      when: not kube_admin_conf.stat.exists
      register: kubeadm_init_result

    - name: Create kube config directory for ubuntu user
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy admin.conf to user's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: true
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: Install Flannel CNI plugin
      become: false
      command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      when: kubeadm_init_result is succeeded or kube_admin_conf.stat.exists

    - name: Generate join command for workers
      command: kubeadm token create --print-join-command
      register: kubeadm_join_cmd

    - name: Share join command to host vars
      set_fact:
        join_command: "{{ kubeadm_join_cmd.stdout }}"
      delegate_to: localhost
      delegate_facts: true

# 3. Join Worker Nodes to Master
- name: Join Worker Nodes to Cluster
  hosts: workers
  become: true
  gather_facts: true
  tasks:
    - name: Check if kubelet.conf exists (already joined)
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Join worker node to the cluster
      command: "{{ hostvars['localhost']['join_command'] }}"
      when:
        - not kubelet_conf.stat.exists
        - hostvars['localhost']['join_command'] is defined

# 4. Install Post-cluster workloads on Master
- name: Install Post-Cluster Workloads on Master
  hosts: master
  become: false
  gather_facts: true
  roles:
    - helm
    - kustomize
    - monitoring
