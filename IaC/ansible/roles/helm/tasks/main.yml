---
- name: Check if helm is installed
  command: which helm
  register: helm_installed
  failed_when: false
  changed_when: false

- name: Install Helm via APT (Debian/Ubuntu)
  block:
    - name: Ensure keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Helm GPG key
      get_url:
        url: https://baltocdn.com/helm/signing.asc
        dest: /etc/apt/keyrings/helm-signing.asc
        mode: '0644'

    - name: Add Helm repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/helm-signing.asc] https://baltocdn.com/helm/stable/debian/ all main"
        state: present
        filename: helm

    - name: Install Helm package
      apt:
        name: helm
        state: present
        update_cache: yes
  when: 
    - helm_installed.rc != 0
    - ansible_os_family == "Debian"
  become: true

- name: Install Helm via shell script (Non-Debian/Local)
  block:
    - name: Download Helm install script
      get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get_helm.sh
        mode: '0755'

    - name: Run Helm install script
      shell: /tmp/get_helm.sh
  when:
    - helm_installed.rc != 0
    - ansible_os_family != "Debian"
